<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tests, paso a paso · motor de animaciones</title>
    <style>
        :root {
            font-family: system-ui, "Segoe UI", sans-serif;
            color-scheme: light dark;
        }
        body {
            margin: 0;
            padding: 20px 16px 48px;
            background: Canvas;
            color: CanvasText;
            line-height: 1.5;
        }
        main {
            max-width: 1040px;
            margin: 0 auto;
        }
        h1 {
            font-size: clamp(1.4rem, 4.5vw, 2rem);
            margin: 0 0 0.3em;
        }
        motor-leccion {
            margin-top: 1em;
        }
    </style>
</head>
<body>
    <main>
        <h1>Tests, paso a paso</h1>
        <p>
            pytest corre cada función <code>test_...</code>, y cada <code>assert</code> compara lo que dio el código
            con lo que se esperaba. Mirá qué pasa cuando uno falla: el test encuentra el error, se corrige, y se
            vuelven a correr todos.
        </p>
        <motor-leccion escena="tests-porcentaje"></motor-leccion>
    </main>

    <script src="../../dist/motor.min.js"></script>
    <script src="con-error.pruebas.js"></script>
    <script src="corregido.pruebas.js"></script>
    <script src="lecciones.js"></script>
</body>
</html>
